name: schedule-lab
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Compare the completed solution with expected output
        type: boolean
        default: false
      huge:
        description: Also check the optional two-million-line file (requires acceptance)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sample consistency
        run: python tools/check_samples.py
      - name: Build and tests (Linux)
        if: runner.os != 'Windows'
        run: bash ./gradlew --no-daemon clean build :app:installDist
      - name: Build and tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean build :app:installDist
      - name: Generate optional large file
        if: inputs.acceptance && inputs.huge
        run: python tools/generate_samples.py --huge
      - name: Compare completed solution (small files)
        if: inputs.acceptance && !inputs.huge
        run: python tools/verify.py
      - name: Compare completed solution (including large file)
        if: inputs.acceptance && inputs.huge
        run: python tools/verify.py --huge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: |
            app/build/reports/tests/test
            app/build/test-results/test
            verification
